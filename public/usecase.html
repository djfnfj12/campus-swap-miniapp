<!doctype html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0}body{width:max-content;background:#fff}svg{display:block}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1040" height="740" viewBox="0 0 1040 740">
<!-- 系统边界 -->
<rect x="170" y="50" width="700" height="650" fill="#FBFDFF" stroke="#1E6FD9" stroke-width="1.6" stroke-dasharray="8 5"/>
<text x="520" y="72" font-size="15" font-weight="bold" fill="#1B5FA8" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">校园闲置物品交易小程序</text>
<!-- 买家连线：到左列用例（直线） -->
<g stroke="#6E8095" stroke-width="1.5" fill="none">
<line x1="106" y1="340" x2="225" y2="210"/>
<line x1="106" y1="340" x2="225" y2="300"/>
<line x1="106" y1="340" x2="225" y2="390"/>
<line x1="106" y1="340" x2="225" y2="480"/>
<line x1="106" y1="340" x2="225" y2="570"/>
<!-- 买家连线：到共享用例（短折线斜接，避免框线错觉） -->
<path d="M106,340 L106,180 L446,128"/>
<path d="M106,340 L106,560 L446,648"/>
<!-- 卖家连线：到右列用例（直线） -->
<line x1="934" y1="340" x2="815" y2="210"/>
<line x1="934" y1="340" x2="815" y2="300"/>
<line x1="934" y1="340" x2="815" y2="390"/>
<!-- 卖家连线：到共享用例（短折线斜接，避免框线错觉） -->
<path d="M934,340 L934,180 L594,128"/>
<path d="M934,340 L934,560 L594,648"/>
</g>
<!-- 左列用例 -->
<g font-size="14" fill="#16324F" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">
<ellipse cx="330" cy="210" rx="105" ry="26" fill="#EAF4FF" stroke="#2B8CFF" stroke-width="1.6"/><text x="330" y="215">浏览与搜索商品</text>
<ellipse cx="330" cy="300" rx="105" ry="26" fill="#EAF4FF" stroke="#2B8CFF" stroke-width="1.6"/><text x="330" y="305">查看商品详情</text>
<ellipse cx="330" cy="390" rx="105" ry="26" fill="#EAF4FF" stroke="#2B8CFF" stroke-width="1.6"/><text x="330" y="395">收藏商品</text>
<ellipse cx="330" cy="480" rx="105" ry="26" fill="#EAF4FF" stroke="#2B8CFF" stroke-width="1.6"/><text x="330" y="485">下单购买</text>
<ellipse cx="330" cy="570" rx="105" ry="26" fill="#EAF4FF" stroke="#2B8CFF" stroke-width="1.6"/><text x="330" y="575">查看订单</text>
<!-- 右列用例 -->
<ellipse cx="710" cy="210" rx="105" ry="26" fill="#EAF4FF" stroke="#2B8CFF" stroke-width="1.6"/><text x="710" y="215">发布闲置商品</text>
<ellipse cx="710" cy="300" rx="105" ry="26" fill="#EAF4FF" stroke="#2B8CFF" stroke-width="1.6"/><text x="710" y="305">编辑与下架商品</text>
<ellipse cx="710" cy="390" rx="105" ry="26" fill="#EAF4FF" stroke="#2B8CFF" stroke-width="1.6"/><text x="710" y="395">订单状态处理</text>
<!-- 共享用例 -->
<ellipse cx="520" cy="110" rx="105" ry="26" fill="#FFF4E5" stroke="#F5A623" stroke-width="1.6"/><text x="520" y="115">注册登录</text>
<ellipse cx="520" cy="630" rx="105" ry="26" fill="#FFF4E5" stroke="#F5A623" stroke-width="1.6"/><text x="520" y="635">即时聊天</text>
</g>
<!-- 买家参与者 -->
<g stroke="#2B3A4D" stroke-width="1.8" fill="#fff">
<circle cx="90" cy="310" r="10"/>
<line x1="90" y1="320" x2="90" y2="374"/>
<line x1="74" y1="340" x2="106" y2="340"/>
<line x1="90" y1="374" x2="76" y2="398"/>
<line x1="90" y1="374" x2="104" y2="398"/>
</g>
<text x="90" y="422" font-size="15" font-weight="bold" fill="#16324F" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">买家</text>
<!-- 卖家参与者 -->
<g stroke="#2B3A4D" stroke-width="1.8" fill="#fff">
<circle cx="950" cy="310" r="10"/>
<line x1="950" y1="320" x2="950" y2="374"/>
<line x1="934" y1="340" x2="966" y2="340"/>
<line x1="950" y1="374" x2="936" y2="398"/>
<line x1="950" y1="374" x2="964" y2="398"/>
</g>
<text x="950" y="422" font-size="15" font-weight="bold" fill="#16324F" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">卖家</text>
<!-- 注释 -->
<text x="520" y="726" font-size="13" fill="#5A6B7D" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">注：同一注册用户既可作为买家下单购买，也可作为卖家发布商品；橙色用例为双方共享</text>
</svg></body></html>
